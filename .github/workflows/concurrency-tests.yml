name: MySQL concurrency integration tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  concurrency-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run MySQL concurrency tests (Testcontainers)
        run: ./gradlew test --tests '*ClickAndVisitConcurrencyIntegrationTest' --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
